<style>
  :root { --ink:#1a1a1a; --muted:#6b7671; --header:#244e43; --accent:#24ac88; --bg:#faf9f7; --line:#e4e6e3; }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:17px; line-height:1.65; -webkit-text-size-adjust:100%;
  }
  header { background:var(--header); color:#fff; padding:38px 24px 30px; }
  .wrap { max-width:720px; margin:0 auto; }
  header h1 { margin:0; font-size:26px; font-weight:800; letter-spacing:-0.4px; }
  header p { margin:8px 0 0; font-size:15px; opacity:0.78; font-weight:500; }
  main { padding:34px 24px 72px; }
  .lead { font-size:18px; line-height:1.7; color:#2b332f; margin:0 0 34px; }
  h2 {
    font-size:19px; font-weight:700; letter-spacing:-0.2px; color:var(--header);
    margin:38px 0 12px; padding-top:22px; border-top:1px solid var(--line);
  }
  h2:first-of-type { border-top:none; padding-top:0; margin-top:0; }
  p { margin:0 0 14px; }
  ul { margin:0 0 14px; padding-left:22px; }
  li { margin:0 0 9px; }
  a { color:var(--accent); text-decoration:none; font-weight:600; }
  a:hover { text-decoration:underline; }
  footer { border-top:1px solid var(--line); margin-top:52px; padding-top:22px; color:var(--muted); font-size:14px; }
  @media (max-width:520px) { body { font-size:16px; } header h1 { font-size:22px; } main { padding:26px 20px 56px; } }
</style>
</head>
<body>
<header><div class="wrap">

</div></header>
